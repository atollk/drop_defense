[package]
name = "drop_defense"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]  # Compile this crate to a dynamic C library.

[dependencies]
godot = { version = "0.5.5", features = [
    # to silence a warning
    "upcoming-editor-placeholders"
] }
itertools = "0.15.0"
paste = "1.0.15"
rand = "0.10.2"
tap = "1.0.1"
